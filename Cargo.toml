[workspace]
members = ["crates/*"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Igor Pie <707208+omgnull@users.noreply.github.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/omgnull/lenka"

[workspace.lints.rust]
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[workspace.dependencies]
lenka-plugin-api = { path = "crates/lenka-plugin-api", version = "0.1.0" }
lenka-core = { path = "crates/lenka-core", version = "0.1.0" }
lenka-driver-local = { path = "crates/lenka-driver-local", version = "0.1.0" }
lenka-artifact-fs = { path = "crates/lenka-artifact-fs", version = "0.1.0" }
lenka-tasks = { path = "crates/lenka-tasks", version = "0.1.0" }
lenka-artifacts = { path = "crates/lenka-artifacts", version = "0.1.0" }
lenka-memory = { path = "crates/lenka-memory", version = "0.1.0" }
lenka-git = { path = "crates/lenka-git", version = "0.1.0" }
lenka-mcp = { path = "crates/lenka-mcp", version = "0.1.0" }
lenka-desktop = { path = "crates/lenka-desktop", version = "0.1.0" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "accesskit"] }
egui = { version = "0.37.0", default-features = false }
egui_extras = { version = "0.37.0", default-features = false }
egui_kittest = { version = "0.37.0", default-features = false }
getrandom = "0.4.3"
insta = "1.49.0"
proptest = "1.12.0"
pollster = "0.4.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rmcp = { version = "3.9.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "io-util"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
uuid = { version = "1.29.0", features = ["v4", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
